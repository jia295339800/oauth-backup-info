<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>个人 Google Drive 备份连接</title><body><main><h1>个人 Google Drive 备份连接</h1><p>Project Backup 桌面客户端仅供账户所有者使用，通过 rclone 与 restic 将个人项目文件加密备份到其 Google Drive，并在需要时恢复。</p><p>应用使用 Google Drive 的 drive.file 权限，访问由该备份客户端创建或经用户授权的文件。它不提供公共账户注册或托管服务。</p><p><a href="privacy.html">隐私说明</a></p></main></body></html>
